<article class="gc-card" [class.gc-card--live]="game.status === 'IN_CORSO'" [class.gc-card--done]="game.status === 'TERMINATA'">
  <div class="gc-top">
    <span
      class="gc-badge"
      [class.gc-badge--waiting]="game.status === 'IN_ATTESA'"
      [class.gc-badge--live]="game.status === 'IN_CORSO'"
      [class.gc-badge--done]="game.status === 'TERMINATA'"
    >
      @if (game.status === 'IN_CORSO') {
        <span class="gc-live-dot" aria-hidden="true"></span>
      }
      {{ statoLabel }}
    </span>

    <button type="button" class="gc-btn gc-btn--icon" (click)="remove.emit()" aria-label="Elimina partita" title="Elimina partita">
      <svg viewBox="0 0 24 24" fill="none" class="gc-icon">
        <path d="M4 7h16M9 7V4h6v3M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <p class="gc-eyebrow">Codice partita</p>
  <p class="gc-codice">{{ game.codice }}</p>

  <div class="gc-stats">
    <div class="gc-stat">
      <svg viewBox="0 0 24 24" fill="none" class="gc-icon">
        <path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="10" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>{{ game.totaleGiocatori }} giocatori</span>
    </div>

    <div class="gc-stat">
      <svg viewBox="0 0 24 24" fill="none" class="gc-icon">
        <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span>{{ game.totaleGruppi }} gruppi</span>
    </div>

    <div class="gc-stat gc-stat--date">
      <svg viewBox="0 0 24 24" fill="none" class="gc-icon">
        <rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2"/>
        <path d="M3 9h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>{{ dataFormattata }} · {{ oraFormattata }}</span>
    </div>
  </div>

  <div class="gc-actions">
    <button type="button" class="gc-btn gc-btn--secondary" (click)="info.emit()">
      <svg viewBox="0 0 24 24" fill="none" class="gc-icon">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
        <path d="M12 11v5M12 8h.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      Info
    </button>

    <button type="button" class="gc-btn gc-btn--primary" (click)="open.emit()">
      Apri
      <svg viewBox="0 0 24 24" fill="none" class="gc-icon">
        <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</article>
