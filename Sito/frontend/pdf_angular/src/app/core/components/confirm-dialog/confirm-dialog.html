<div class="cd-backdrop" (click)="onBackdropClick()">
  <div class="cd-modal" [class.cd-modal--danger]="danger" (click)="$event.stopPropagation()" role="alertdialog" aria-modal="true" [attr.aria-label]="title">
    <div class="cd-icon" [class.cd-icon--danger]="danger">
      @if (danger) {
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 9v4M12 17h.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
          <path d="M12 11v5M12 8h.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      }
    </div>

    <h2 class="cd-title">{{ title }}</h2>
    @if (message) { <p class="cd-message">{{ message }}</p> }
    <ng-content></ng-content>

    <div class="cd-actions">
      <button type="button" class="cd-btn cd-btn--ghost" (click)="cancel.emit()" [disabled]="loading">
        {{ cancelLabel }}
      </button>
      <button
        type="button"
        class="cd-btn"
        [class.cd-btn--danger]="danger"
        [class.cd-btn--primary]="!danger"
        (click)="confirm.emit()"
        [disabled]="loading"
      >
        @if (loading) { Attendere... } @else { {{ confirmLabel }} }
      </button>
    </div>
  </div>
</div>
