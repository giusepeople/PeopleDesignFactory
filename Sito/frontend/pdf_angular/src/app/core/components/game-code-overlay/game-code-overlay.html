<div class="gco-overlay">
  <div class="gco-bg" aria-hidden="true">
    <div class="gco-bg-grid"></div>
    <div class="gco-blob gco-blob--a"></div>
    <div class="gco-blob gco-blob--b"></div>
  </div>

  <div class="gco-top-actions">
    <button
      type="button"
      class="gco-icon-btn"
      (click)="toggleFullscreen()"
      [attr.aria-label]="isFullscreen() ? 'Esci da schermo intero' : 'Schermo intero'"
      [title]="isFullscreen() ? 'Esci da schermo intero' : 'Schermo intero'"
    >
      @if (isFullscreen()) {
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 3v4a2 2 0 0 1-2 2H3M15 3v4a2 2 0 0 0 2 2h4M21 15h-4a2 2 0 0 0-2 2v4M3 15h4a2 2 0 0 1 2 2v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      }
    </button>
    <button type="button" class="gco-icon-btn" (click)="close.emit()" aria-label="Chiudi">✕</button>
  </div>

  <div class="gco-content">
    <p class="gco-eyebrow">Codice partita</p>
    <p class="gco-code">{{ codice }}</p>

    <div class="gco-qr-card">
      @if (qrDataUrl(); as src) {
        <img [src]="src" alt="QR code per entrare nella partita" class="gco-qr-img" />
      } @else {
        <div class="gco-qr-placeholder">QR</div>
      }
      <p class="gco-qr-caption">
        Inquadra il QR con la fotocamera<br />
        oppure vai su <strong>{{ joinUrl }}</strong>
      </p>
    </div>

    <p class="gco-hint">Premi ESC o ✕ per uscire</p>
  </div>
</div>
